[project]
name = "analytical-platform-dashboard-service"
version = "0.1.0"
description = "Dashboard Service for Analytical Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib==1.9.5",
    "cryptography==50.0.2",
    "django==5.2.19",
    "django-extensions==4.1",
    "django-structlog==11.0.0",
    "gunicorn==26.2.0",
    "psycopg[binary]==3.3.8",
    "pytest-django==4.14.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "sentry-sdk==2.74.0",
    "urllib3==2.8.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==8.0.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "sqlparse==0.6.1",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pytest.ini_options]
addopts = "-v --tb=auto --ds=dashboard_service.settings.test"
testpaths = ["tests"]
