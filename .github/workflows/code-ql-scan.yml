name: 🔬 CodeQL Analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ministryofjustice/analytical-platform-github-actions/.github/workflows/reusable-codeql-analysis.yml@9b4bf99502d9691d9f38e4441e5eb7a34f5131a9 # v8.0.9
    with:
      languages: '["actions", "python"]'
