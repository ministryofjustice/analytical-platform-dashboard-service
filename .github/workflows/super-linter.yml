---
name: 🦝 Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      pull-requests: write
      packages: read
      statuses: write
    uses: ministryofjustice/analytical-platform-github-actions/.github/workflows/reusable-super-linter.yml@edf953a35f288dff2b0bca09b0f66ff1d90dad07 # v8.0.7
    with:
      # VALIDATE_CHECKOV: false # Disabling while in discovery
      # VALIDATE_KUBERNETES_KUBECONFORM is set to false as it cannot process Helm charts
      super-linter-variables: |
        {
          "LINTER_RULES_PATH": ".",
          "CSS_FILE_NAME": ".stylelintrc.json",
          "PYTHON_RUFF_CONFIG_FILE": "pyproject.toml",
          "PYTHON_RUFF_FORMAT_CONFIG_FILE": "pyproject.toml",
          "VALIDATE_CHECKOV": false,
          "VALIDATE_DOCKERFILE_HADOLINT": false,
          "VALIDATE_HTML": false,
          "VALIDATE_JSCPD": false,
          "VALIDATE_JUPYTER_NBQA_RUFF": false,
          "VALIDATE_KUBERNETES_KUBECONFORM": false,
          "VALIDATE_PYTHON_BLACK": false,
          "VALIDATE_PYTHON_ISORT": false,
          "VALIDATE_PYTHON_PYLINT": false,
          "VALIDATE_PYTHON_MYPY": false,
          "VALIDATE_YAML": false
        }
