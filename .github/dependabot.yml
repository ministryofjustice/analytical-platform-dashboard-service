---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "github-actions"
    commit-message:
      include: "scope"
      prefix: ":dependabot: github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      analytical-platform-github-actions:
        patterns:
          - "ministryofjustice/analytical-platform-github-actions*"
    schedule:
      interval: "daily"
  - package-ecosystem: "uv"
    commit-message:
      include: "scope"
      prefix: ":dependabot: uv"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      uv-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    commit-message:
      include: "scope"
      prefix: ":dependabot: npm"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    commit-message:
      include: "scope"
      prefix: ":dependabot: docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"
